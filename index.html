  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      --bg: #0e1014;
      --bg-elev: #14171d;
      --surface: #1b1f28;
      --surface-2: #242a35;
      --hairline: rgba(244, 241, 234, 0.09);
      --text: #f4f1ea;
      --text-dim: #a39e93;
      --gold: #e3a44d;
      --gold-soft: #f0c27a;
      --cream: #f6ecd6;
      --danger: #ee6d6d;
      --danger-bg: rgba(238, 109, 109, 0.12);
      --ok: #74c69d;
      --ok-bg: rgba(116, 198, 157, 0.12);
      --warn-bg: rgba(227, 164, 77, 0.14);
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      --radius: 18px;
      --radius-sm: 12px;
      --header-h: 56px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    [data-theme="light"] {
      --bg: #efe8dc;
      --bg-elev: #f7f1e7;
      --surface: #fffcf7;
      --surface-2: #f1e9dc;
      --hairline: rgba(26, 24, 20, 0.1);
      --text: #1a1814;
      --text-dim: #6d675c;
      --gold: #a86b12;
      --gold-soft: #c9923a;
      --cream: #3a2e1a;
      --danger: #c23b3b;
      --danger-bg: rgba(194, 59, 59, 0.1);
      --ok: #2d7a56;
      --ok-bg: rgba(45, 122, 86, 0.1);
      --warn-bg: rgba(168, 107, 18, 0.12);
      --shadow: 0 12px 32px rgba(80, 50, 10, 0.1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    html { height: 100%; }
    body {
      min-height: 100%;
      min-height: 100dvh;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    a { color: var(--gold); }
    h1, h2, h3 { font-weight: 650; letter-spacing: -0.03em; margin: 0; }
    p { margin: 0; }
    #app { min-height: 100dvh; }
    .page {
      padding: calc(var(--safe-t) + 12px) calc(20px + var(--safe-r)) calc(28px + var(--safe-b)) calc(20px + var(--safe-l));
      max-width: 560px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: var(--header-h);
      margin-bottom: 8px;
    }
    .topbar h1 { font-size: 28px; flex: 1; letter-spacing: -0.04em; }
    .topbar .sub {
      flex: 1;
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 500;
    }
    .brand-block { flex: 1; min-width: 0; }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .icon-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--hairline);
      color: var(--text);
      flex-shrink: 0;
    }
    .icon-btn:active { transform: scale(0.96); }
    .icon-btn svg { width: 20px; height: 20px; display: block; }
    .back-label {
      display: inline-flex; align-items: center; gap: 2px;
      font-size: 16px; font-weight: 500; color: var(--gold);
      padding: 10px 6px 10px 0; min-height: 44px;
    }
    .back-label svg { width: 22px; height: 22px; }
    .actions { display: flex; gap: 8px; }

    .car-list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
    .car-card, .panel {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      padding: 16px 16px 14px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
    }
    .car-card { text-align: left; width: 100%; color: inherit; display: block; }
    .car-card:active { transform: scale(0.995); background: var(--surface-2); }
    .car-card .name { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 8px; padding-right: 8px; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .rows { display: flex; flex-direction: column; gap: 4px; }
    .row-line { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
    .row-line .lbl { color: var(--text-dim); }
    .row-line .val { font-weight: 550; text-align: right; }
    .alert-note {
      margin-top: 10px;
      font-size: 13px;
      color: var(--gold);
      background: var(--warn-bg);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .pill {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 650; letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 8px; border-radius: 999px;
      background: var(--surface-2); color: var(--text-dim);
      white-space: nowrap;
    }
    .pill.ok { background: var(--ok-bg); color: var(--ok); }
    .pill.warn { background: var(--warn-bg); color: var(--gold); }
    .pill.due { background: var(--danger-bg); color: var(--danger); }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 8px 0 20px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }
    .stat.wide { grid-column: 1 / -1; }
    .stat .lbl {
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-dim); font-weight: 600; margin-bottom: 4px;
    }
    .stat .val { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; }
    .stat .hint { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin: 8px 0 10px;
    }
    .section-head h2 { font-size: 18px; }
    .section-head .count { color: var(--text-dim); font-size: 13px; }

    .history { display: flex; flex-direction: column; gap: 8px; }
    .service-row {
      display: flex; flex-direction: column; gap: 2px;
      text-align: left; width: 100%; color: inherit;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }
    .service-row:active { background: var(--surface-2); }
    .service-row .title { font-weight: 620; letter-spacing: -0.01em; }
    .service-row .meta { font-size: 13px; color: var(--text-dim); }
    .service-row .notes { font-size: 13px; margin-top: 6px; color: var(--cream); }
    .service-row .warn {
      font-size: 12px; color: var(--gold); margin-top: 6px;
      background: var(--warn-bg); border-radius: 8px; padding: 6px 8px;
    }

    .empty {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px dashed var(--hairline);
      border-radius: var(--radius);
    }
    .empty strong { display: block; color: var(--text); margin-bottom: 4px; font-size: 16px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 48px; padding: 0 18px;
      border-radius: 14px; font-weight: 620;
      border: 1px solid var(--hairline);
      background: var(--surface-2);
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--gold);
      color: #1a1408;
      border-color: transparent;
      width: 100%;
    }
    .btn-ghost { background: transparent; }
    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: transparent;
      width: 100%;
    }
    .btn-row { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .btn-row.inline { flex-direction: row; }
    .btn-row.inline .btn { flex: 1; }

    .fab-wrap { margin-top: 16px; }

    .sheet-backdrop, .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 40;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 12px 12px calc(12px + var(--safe-b));
      animation: fadein .2s ease;
    }
    .sheet, .modal {
      width: 100%; max-width: 560px;
      background: var(--bg-elev);
      border: 1px solid var(--hairline);
      border-radius: 22px;
      padding: 10px 18px 18px;
      box-shadow: var(--shadow);
      max-height: min(92dvh, 900px);
      overflow: auto;
      animation: rise .28s ease;
    }
    .modal { align-self: center; max-width: 400px; padding: 22px 20px; }
    .grab {
      width: 36px; height: 4px; border-radius: 4px;
      background: var(--hairline); margin: 4px auto 12px;
    }
    .sheet h2 { font-size: 22px; margin-bottom: 14px; }
    .modal h2 { font-size: 18px; margin-bottom: 8px; }
    .modal p { color: var(--text-dim); font-size: 15px; margin-bottom: 18px; }

    .form-stack { display: flex; flex-direction: column; gap: 12px; }
    label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-dim); }
    label.field input, label.field textarea, label.field select {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      color: var(--text);
      width: 100%;
      outline: none;
    }
    label.field input:focus, label.field textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--warn-bg);
    }
    label.field textarea { resize: vertical; min-height: 80px; }

    .menu {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: flex-start; justify-content: flex-end;
      padding: calc(var(--safe-t) + 60px) calc(16px + var(--safe-r)) 20px;
    }
    .menu-card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      min-width: 230px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .menu-card button {
      display: block; width: 100%; text-align: left;
      padding: 14px 16px; font-size: 16px;
      border-bottom: 1px solid var(--hairline);
      background: transparent;
    }
    .menu-card button:last-child { border-bottom: 0; }
    .menu-card button:active { background: var(--surface-2); }
    .menu-card button.danger { color: var(--danger); }

    .install-tip {
      margin-top: 22px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text-dim);
    }
    .install-tip strong { color: var(--text); }
    .install-tip .share { color: var(--gold); font-weight: 620; }

    .footer-note {
      margin-top: 22px;
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
    }


    .specs { margin: -4px 0 18px; }
    .specs .lbl {
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--gold); font-weight: 600; margin-bottom: 6px;
    }
    .specs-body { font-size: 14px; color: var(--text-dim); white-space: pre-wrap; line-height: 1.5; }
    .car-notes { color: var(--text-dim); margin: -8px 0 16px; font-size: 14px; white-space: pre-wrap; }
    .unit-row { display: flex; gap: 8px; margin-top: 6px; }
    .unit-row label {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; border: 1px solid var(--hairline); border-radius: 12px;
      background: var(--surface); font-weight: 620; color: var(--text); font-size: 16px;
    }
    .unit-row input { accent-color: var(--gold); width: 16px; height: 16px; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

  let db = null;

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function mergeSeed(data) {
    const current = Number(data && data.seedVersion) || 0;
    if (current >= SEED_VERSION) return data;
    const seed = JSON.parse(JSON.stringify(SEED));
    const existingById = {};
    (data.cars || []).forEach(function (c) { existingById[c.id] = c; });
    const seedIds = {};
    const mergedCars = [];
    seed.cars.forEach(function (sc) {
      seedIds[sc.id] = true;
      const ex = existingById[sc.id];
      if (!ex) {
        mergedCars.push(sc);
        return;
      }
      if (!(ex.specs && String(ex.specs).trim()) && sc.specs) ex.specs = sc.specs;
      const legacy = LEGACY_NOTES[sc.id] || [];
      if (legacy.indexOf(ex.notes) !== -1) ex.notes = sc.notes || "";
      else if ((!ex.notes || !String(ex.notes).trim()) && sc.notes) ex.notes = sc.notes;
      ex.services = ex.services || [];
      const svcById = {};
      ex.services.forEach(function (s) { svcById[s.id] = s; });
      sc.services.forEach(function (ss) {
        const es = svcById[ss.id];
        if (!es) {
          ex.services.push(JSON.parse(JSON.stringify(ss)));
          return;
        }
        if (!es.unit && ss.unit) es.unit = ss.unit;
        if ((es.notes == null || es.notes === "") && ss.notes) es.notes = ss.notes;
        if ((es.shop == null || es.shop === "") && ss.shop) es.shop = ss.shop;
        if ((es.km == null || es.km === "") && ss.km != null) es.km = ss.km;
        if (es.date == null || es.date === "") {
          if (ss.date) es.date = ss.date;
        }
      });
      mergedCars.push(ex);
    });
    (data.cars || []).forEach(function (c) {
      if (!seedIds[c.id] && REMOVED_CAR_IDS.indexOf(c.id) === -1) mergedCars.push(c);
    });
    data.cars = mergedCars;
    data.seedVersion = SEED_VERSION;
    data.version = SEED_VERSION;
    return data;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.cars)) {
          const merged = mergeSeed(parsed);
          save(merged);
          return merged;
        }
      }
    } catch (e) { /* ignore corrupt storage and fall back to seed */ }
    const fresh = JSON.parse(JSON.stringify(SEED));
    fresh.seedVersion = SEED_VERSION;
    fresh.version = SEED_VERSION;
    save(fresh);
    return fresh;
  }

  function save(data) {
    data.updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function persist() { save(db); }

  function applyTheme(theme) {
    const t = theme || localStorage.getItem(THEME_KEY) || "system";
    const darkPref = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const resolved = t === "system" ? (darkPref ? "dark" : "light") : t;
    if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    const color = resolved === "light" ? "#efe8dc" : "#0e1014";
    let meta = document.querySelector("meta[name=theme-color]:not([media])");
    if (!meta) {
      meta = document.createElement("meta");
      meta.setAttribute("name", "theme-color");
      document.head.appendChild(meta);
    }
    meta.setAttribute("content", color);
    return resolved;
  }

  function currentTheme() {
    return localStorage.getItem(THEME_KEY) || "system";
  }

  function isStandalone() {
    return window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  }
  function isIos() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function parseDate(iso) {
    if (!iso) return null;
    const p = String(iso).slice(0, 10).split("-");
    if (p.length !== 3) return null;
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
  }

  function fmtDate(iso) {
    const d = parseDate(iso);
    if (!d) return "No date";
    return d.toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" });
  }

  function svcUnit(svc) {
    if (svc && (svc.unit === "mi" || svc.unit === "miles" || svc.unit === "mile")) return "mi";
    return "km";
  }

  function hasOdo(svc) {
    return !!(svc && svc.km !== null && svc.km !== undefined && svc.km !== "" && !Number.isNaN(Number(svc.km)));
  }

  function fmtOdo(n, unit) {
    if (n === null || n === undefined || n === "" || Number.isNaN(Number(n))) return "—";
    const u = unit === "mi" ? "mi" : "km";
    return Number(n).toLocaleString("en-CA") + " " + u;
  }

  function fmtMoney(n) {
    if (n === null || n === undefined || n === "") return "";
    return new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD" }).format(Number(n));
  }

  function todayISO() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function isOil(svc) { return /oil/i.test((svc && svc.type) || ""); }

  function intervalInUnit(intervalKm, unit) {
    const n = Number(intervalKm) > 0 ? Number(intervalKm) : 8000;
    if (unit === "mi") return Math.round(n / KM_PER_MILE);
    return n;
  }

  function sortedServices(car) {
    return (car.services || []).slice().sort(function (a, b) {
      const ad = a.date || "";
      const bd = b.date || "";
      if (!ad && !bd) return 0;
      if (!ad) return -1;
      if (!bd) return 1;
      if (ad === bd) return (Number(b.km) || 0) - (Number(a.km) || 0);
      return ad < bd ? 1 : -1;
    });
  }

  function lastService(car) {
    return sortedServices(car)[0] || null;
  }

  function lastOdometer(car) {
    return sortedServices(car).find(hasOdo) || null;
  }

  function lastOil(car) {
    return sortedServices(car).find(function (s) { return isOil(s) && hasOdo(s); }) || null;
  }

  function odometerOutOfOrder(car) {
    const byDate = (car.services || []).filter(function (s) { return s.date && hasOdo(s); }).slice().sort(function (a, b) {
      if (a.date === b.date) return (Number(a.km) || 0) - (Number(b.km) || 0);
      return a.date < b.date ? -1 : 1;
    });
    const groups = { km: [], mi: [] };
    byDate.forEach(function (s) { groups[svcUnit(s)].push(s); });
    for (const unit of ["km", "mi"]) {
      const arr = groups[unit];
      for (let i = 1; i < arr.length; i++) {
        if (Number(arr[i].km) < Number(arr[i - 1].km)) return true;
      }
    }
    return false;
  }

  function outOfOrderMessage(car) {
    if (!odometerOutOfOrder(car)) return "";
    if (car.id === "car-tundra") return "Odometer readings are out of order — check the dates and readings. The December 2025 Tundra entry may be a typo.";
    if (car.id === "car-allroad") return "Odometer readings are out of order — check the dates and readings. The January 2023 Allroad reading of 10,800 km is probably 110,800 km.";
    return "Odometer readings are out of order — check the dates and readings.";
  }

  function isFlagNote(notes) {
    return /typo|probably/i.test(notes || "");
  }

  function summary(car) {
    const intervalKm = Number(car.oilIntervalKm) > 0 ? Number(car.oilIntervalKm) : 8000;
    const last = lastService(car);
    const odo = lastOdometer(car);
    const oil = lastOil(car);
    const dueUnit = oil ? svcUnit(oil) : (odo ? svcUnit(odo) : "km");
    const lastUnit = odo ? svcUnit(odo) : dueUnit;
    const lastKm = odo ? Number(odo.km) : null;
    const interval = intervalInUnit(intervalKm, dueUnit);
    const dueKm = (oil && hasOdo(oil)) ? Number(oil.km) + intervalInUnit(intervalKm, svcUnit(oil)) : null;
    let remaining = null, status = "none", statusLabel = "No oil log";
    if (dueKm !== null && lastKm !== null) {
      let lastInDue = lastKm;
      if (lastUnit !== dueUnit) {
        lastInDue = dueUnit === "km" ? lastKm * KM_PER_MILE : lastKm / KM_PER_MILE;
      }
      remaining = dueKm - lastInDue;
      const soon = dueUnit === "mi" ? 600 : 1000;
      if (remaining <= 0) { status = "due"; statusLabel = "Overdue"; }
      else if (remaining <= soon) { status = "warn"; statusLabel = "Due soon"; }
      else { status = "ok"; statusLabel = "On track"; }
    }
    return { intervalKm, interval, last, oil, odo, lastKm, lastUnit, dueKm, dueUnit, remaining, status, statusLabel };
  }

  function remainText(s) {
    if (s.remaining === null) return "";
    const u = s.dueUnit === "mi" ? " mi" : " km";
    const n = Math.abs(Math.round(s.remaining)).toLocaleString("en-CA");
    return s.remaining <= 0 ? n + u + " overdue" : n + u + " left";
  }

  function findCar(id) { return (db.cars || []).find(function (c) { return c.id === id; }); }
  function findService(car, id) { return (car.services || []).find(function (s) { return s.id === id; }); }

  function route() {
    const h = (location.hash || "#/").replace(/^#/, "");
    const parts = h.split("/").filter(Boolean);
    if (!parts.length) return { name: "home" };
    if (parts[0] === "car" && parts[1] === "new") return { name: "car-edit", carId: null };
    if (parts[0] === "car" && parts[1]) {
      const carId = parts[1];
      if (parts[2] === "edit") return { name: "car-edit", carId: carId };
      if (parts[2] === "service" && parts[3] === "new") return { name: "service-edit", carId: carId, svcId: null };
      if (parts[2] === "service" && parts[3] && parts[4] === "edit") return { name: "service-edit", carId: carId, svcId: parts[3] };
      if (parts[2] === "service" && parts[3]) return { name: "service-edit", carId: carId, svcId: parts[3] };
      return { name: "car", carId: carId };
    }
    return { name: "home" };
  }

  function renderCar(carId) {

    const dueHint = s.oil
      ? "Last oil at " + fmtOdo(s.oil.km, svcUnit(s.oil)) + " + " + Number(s.interval).toLocaleString("en-CA") + " " + (s.dueUnit === "mi" ? "mi" : "km") + " interval"

          const note = svc.notes
            ? (isFlagNote(svc.notes)

      : '<div class="empty"><strong>No services yet</strong>Log an oil change, rotation, or other work.</div>';

    return '<div class="page">' +
      '<header class="topbar">' +
      '<button class="back-label" type="button" data-action="home">' + ICONS.back + " Garage</button>" +
      '<div class="actions">' + iconBtn("edit-car", '<span style="font-size:13px;font-weight:700">Edit</span>', "Edit car", ' data-id="' + esc(car.id) + '" style="width:auto;padding:0 14px;border-radius:22px;font-variant:none"') + "</div>" +
      "</header>" +
      "<h1 style=\"font-size:26px;margin:4px 0 16px\">" + esc(car.name) + "</h1>" +
      warn +
      '<div class="summary">' +
      '<div class="stat"><div class="lbl">Last service</div><div class="val">' + (s.last ? esc(fmtDate(s.last.date)) : "—") + "</div>" +
      '<div class="hint">' + (s.last ? esc(s.last.type) : "Nothing logged") + "</div></div>" +
      '<div class="stat"><div class="lbl">Odometer</div><div class="val">' + esc(fmtOdo(s.lastKm, s.lastUnit)) + "</div>" +
      '<div class="hint">' + esc(services.length ? (services.length + " logged") : "No readings") + "</div></div>" +
      '<div class="stat wide"><div class="lbl">Next oil change</div><div class="val">' + esc(dueVal) +
      ' <span class="pill ' + s.status + '">' + esc(s.statusLabel) + "</span></div>" +
      '<div class="hint">' + esc(dueHint) + (remain ? " · " + remain : "") + "</div></div>" +
      "</div>" +
      specs + notes +
      '<div class="section-head"><h2>History</h2><span class="count">' + services.length + "</span></div>" +
      history +
      '<div class="fab-wrap"><button class="btn btn-primary" type="button" data-action="add-service" data-id="' + esc(car.id) + '">' + ICONS.plus + " Add service</button></div>" +
      "</div>";
  }

  function renderMissing() {
    return '<div class="page"><header class="topbar"><button class="back-label" type="button" data-action="home">' + ICONS.back + ' Garage</button></header>' +
      '<div class="empty"><strong>Car not found</strong>It may have been deleted.</div></div>';
  }

  function field(name, label, attrs, value, tag) {
    tag = tag || "input";
    const inner = tag === "textarea"
      ? "<textarea name=\"" + name + "\" " + attrs + ">" + esc(value || "") + "</textarea>"
      : "<input name=\"" + name + "\" " + attrs + " value=\"" + esc(value == null ? "" : value) + "\">";
    return '<label class="field">' + esc(label) + inner + "</label>";
  }

  function unitPicker(selected) {
    const km = selected !== "mi";
    return '<div class="field"><span>Odometer unit</span><div class="unit-row">' +
      '<label><input type="radio" name="unit" value="km"' + (km ? " checked" : "") + "> km</label>" +
      '<label><input type="radio" name="unit" value="mi"' + (km ? "" : " checked") + "> mi</label>" +
      "</div></div>";
  }

  function renderCarForm(carId) {
    const car = carId ? findCar(carId) : null;
    if (carId && !car) return renderMissing();
    const title = car ? "Edit car" : "New car";
    const name = car ? car.name : "";
    const interval = car ? car.oilIntervalKm : 8000;
    const specs = car ? (car.specs || "") : "";
    const notes = car ? (car.notes || "") : "";
    const del = car
      ? '<button class="btn btn-danger" type="button" data-action="delete-car" data-id="' + esc(car.id) + '">Delete car</button>'
      : "";
    const back = car ? "#/car/" + car.id : "#/";
    return '<div class="sheet-backdrop" data-go="' + esc(back) + '">' +
      '<form class="sheet" data-form="car" data-id="' + esc(car ? car.id : "") + '" data-stop="1">' +
      '<div class="grab"></div><h2>' + title + "</h2>" +
      '<div class="form-stack">' +
      field("name", "Name", 'type="text" required placeholder="2023 Toyota Tundra" autocomplete="off"', name) +
      field("oilIntervalKm", "Oil-change interval (km)", 'type="number" required min="1000" step="100" inputmode="numeric"', interval) +
      field("specs", "Specs", 'rows="4" placeholder="VIN, oil type, filters…"', specs, "textarea") +
      field("notes", "Notes", 'rows="3" placeholder="Optional"', notes, "textarea") +
      "</div>" +
      '<div class="btn-row"><button class="btn btn-primary" type="submit">Save</button>' +
      '<button class="btn btn-ghost" type="button" data-action="nav" data-href="' + esc(back) + '">Cancel</button>' + del +
      "</div></form></div>";
  }

  function renderServiceForm(carId, svcId) {
    const car = findCar(carId);
    if (!car) return renderMissing();
    const svc = svcId ? findService(car, svcId) : null;
    if (svcId && !svc) return renderMissing();
    const title = svc ? "Edit service" : "Add service";
    const odo = lastOdometer(car);
    const date = svc ? (svc.date || "") : todayISO();
    const type = svc ? svc.type : "Oil Change";
    const km = svc && hasOdo(svc) ? svc.km : "";
    const unit = svc ? svcUnit(svc) : (odo ? svcUnit(odo) : "km");
    const shop = svc ? svc.shop : "";
    const cost = svc && svc.cost !== null && svc.cost !== undefined ? svc.cost : "";
    const notes = svc ? svc.notes : "";
    const back = "#/car/" + car.id;
    const del = svc
      ? '<button class="btn btn-danger" type="button" data-action="delete-service" data-car="' + esc(car.id) + '" data-id="' + esc(svc.id) + '">Delete service</button>'
      : "";
    return renderCar(carId) +
      '<div class="sheet-backdrop" data-go="' + esc(back) + '">' +
      '<form class="sheet" data-form="service" data-car="' + esc(car.id) + '" data-id="' + esc(svc ? svc.id : "") + '" data-stop="1">' +
      '<div class="grab"></div><h2>' + title + "</h2>" +
      '<div class="form-stack">' +
      field("date", "Date", 'type="date"', date) +
      field("type", "Service type", 'type="text" required list="service-types" placeholder="Oil Change" autocomplete="off"', type) +
      field("km", "Odometer", 'type="number" min="0" step="1" inputmode="numeric" placeholder="Optional"', km) +
      unitPicker(unit) +
      field("shop", "Shop", 'type="text" placeholder="Optional" autocomplete="off"', shop) +
      field("cost", "Cost (CAD)", 'type="number" min="0" step="0.01" inputmode="decimal" placeholder="Optional"', cost) +
      field("notes", "Notes", 'rows="3" placeholder="Oil brand, warranty, etc."', notes, "textarea") +
      "</div>" +
      '<div class="btn-row"><button class="btn btn-primary" type="submit">Save</button>' +
      '<button class="btn btn-ghost" type="button" data-action="nav" data-href="' + esc(back) + '">Cancel</button>' + del +
      "</div></form></div>";
  }

  function renderConfirm() {
    if (!confirmState) return "";
    return '<div class="modal-backdrop" data-action="confirm-no">' +
      '<div class="modal" data-stop="1">' +
      "<h2>" + esc(confirmState.title) + "</h2>" +
      "<p>" + esc(confirmState.body) + "</p>" +
      '<div class="btn-row inline">' +
      '<button class="btn" type="button" data-action="confirm-no">Cancel</button>' +
      '<button class="btn ' + (confirmState.danger ? "btn-danger" : "btn-primary") + '" type="button" data-action="confirm-yes">' +
      esc(confirmState.label || "OK") + "</button>" +
      "</div></div></div>";
  }

  function render() {
    applyTheme();
    const r = route();
    let html = "";
    if (r.name === "home") html = renderHome();
    else if (r.name === "car") html = renderCar(r.carId);
    else if (r.name === "car-edit") {
      html = (r.carId ? renderCar(r.carId) : renderHome()) + renderCarForm(r.carId);
    } else if (r.name === "service-edit") {
      html = renderServiceForm(r.carId, r.svcId);
    } else html = renderHome();
    html += renderConfirm();
    document.getElementById("app").innerHTML = html;
  }

  function askConfirm(opts) {
    return new Promise(function (resolve) {
      confirmState = {
        title: opts.title,
        body: opts.body,
        danger: !!opts.danger,
        label: opts.label || "Delete",
        resolve: resolve
      };
      render();
    });
  }

  function finishConfirm(ok) {
    const st = confirmState;
    confirmState = null;
    if (st && st.resolve) st.resolve(!!ok);
    render();
  }

  function onSubmitCar(form) {
    const name = form.name.value.trim();
    const interval = Number(form.oilIntervalKm.value);
    const specs = form.specs.value.trim();
    const notes = form.notes.value.trim();
    if (!name || !(interval >= 1000)) return;
    const id = form.getAttribute("data-id");
    if (id) {
      const car = findCar(id);
      if (!car) return;
      car.name = name;
      car.oilIntervalKm = interval;
      car.specs = specs;
      car.notes = notes;
      persist();
      go("#/car/" + id);
    } else {
      const newId = uid();
      db.cars.push({ id: newId, name: name, oilIntervalKm: interval, specs: specs, notes: notes, services: [] });
      persist();
      go("#/car/" + newId);
    }
  }

  function onSubmitService(form) {
    const carId = form.getAttribute("data-car");
    const car = findCar(carId);
    if (!car) return;
    const date = form.date.value || "";
    const type = form.type.value.trim();
    const kmRaw = form.km.value.trim();
    const km = kmRaw === "" ? null : Number(kmRaw);
    const unitEl = form.querySelector('input[name="unit"]:checked');
    const unit = unitEl && unitEl.value === "mi" ? "mi" : "km";
    const shop = form.shop.value.trim();
    const costRaw = form.cost.value.trim();
    const cost = costRaw === "" ? null : Number(costRaw);
    const notes = form.notes.value.trim();
    if (!type) return;
    if (km !== null && (Number.isNaN(km) || km < 0)) return;
    const id = form.getAttribute("data-id");
    const rec = { date: date || null, type: type, shop: shop, km: km, unit: unit, cost: (cost === null || Number.isNaN(cost) ? null : cost), notes: notes };
    if (id) {
      const svc = findService(car, id);
      if (!svc) return;
      Object.assign(svc, rec);
    } else {
      rec.id = uid();
      car.services.push(rec);
    }
    persist();
    go("#/car/" + carId);
  }

  async function deleteCar(id) {
    const car = findCar(id);
    if (!car) return;
    const ok = await askConfirm({
      title: "Delete this car?",
      body: "This removes " + car.name + " and all of its service history from this device.",
      danger: true,
      label: "Delete"
    });
    if (!ok) return;
    db.cars = db.cars.filter(function (c) { return c.id !== id; });
    persist();
    go("#/");
  }

  async function deleteService(carId, svcId) {
    const car = findCar(carId);
    if (!car) return;
    const ok = await askConfirm({
      title: "Delete this service?",
      body: "This cannot be undone, except by importing a backup.",
      danger: true,
      label: "Delete"
    });
    if (!ok) return;
    car.services = car.services.filter(function (s) { return s.id !== svcId; });
    persist();
    go("#/car/" + carId);
  }

  function exportBackup() {
    const payload = {
      app: "garage-car-maintenance",
      version: SEED_VERSION,
      seedVersion: db.seedVersion || SEED_VERSION,
      exportedAt: new Date().toISOString(),
      cars: db.cars
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "garage-backup-" + todayISO() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    menuOpen = false;
    render();
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = async function () {
      try {
        const data = JSON.parse(reader.result);
        const cars = data.cars || (data.data && data.data.cars);
        if (!Array.isArray(cars)) throw new Error("No cars array");
        const ok = await askConfirm({
          title: "Replace all data?",
          body: "Importing this backup will replace the cars and service history currently on this device. Missing cars and entries from the latest notes will still be added in.",
          danger: true,
          label: "Import"
        });
        if (!ok) return;
        db = mergeSeed({ cars: cars, seedVersion: data.seedVersion || 0 });
        persist();
        go("#/");
        render();
      } catch (e) {
        await askConfirm({
          title: "Couldn’t import",
          body: "That file doesn’t look like a Garage backup. Export a JSON backup from this app and try that file.",
          danger: false,
          label: "OK"
        });
      }
    };
    reader.readAsText(file);
  }

  async function restoreSeed() {
    const ok = await askConfirm({
      title: "Restore original entries?",
      body: "This replaces everything on this device with the cars and service history from your notes.",
      danger: true,
      label: "Restore"
    });
    if (!ok) return;
    db = JSON.parse(JSON.stringify(SEED));
    db.seedVersion = SEED_VERSION;
    persist();
    menuOpen = false;
    go("#/");
    render();
  }

  document.getElementById("app").addEventListener("click", function (e) {
    const goEl = e.target.closest("[data-go]");
    const el = e.target.closest("[data-action]");
    if (goEl && !e.target.closest("[data-form]") && !e.target.closest("[data-action]")) {
      e.preventDefault();
      go(goEl.getAttribute("data-go"));
      return;
    }
    if (!el) {
      if (e.target.classList.contains("menu") || e.target.classList.contains("sheet-backdrop")) {
        if (e.target.classList.contains("menu")) { menuOpen = false; render(); }
        if (e.target.classList.contains("sheet-backdrop")) go(e.target.getAttribute("data-go") || "#/");
      }
      return;
    }
    if (el.closest("[data-stop]") && el.getAttribute("data-action") === "close-menu") return;
    const action = el.getAttribute("data-action");
    const id = el.getAttribute("data-id");
    if (action === "open-car") go("#/car/" + id);
    else if (action === "home") go("#/");
    else if (action === "nav") go(el.getAttribute("data-href") || "#/");
    else if (action === "add-car") go("#/car/new");
    else if (action === "edit-car") go("#/car/" + id + "/edit");
    else if (action === "add-service") go("#/car/" + id + "/service/new");
    else if (action === "open-service") go("#/car/" + el.getAttribute("data-car") + "/service/" + id + "/edit");
    else if (action === "delete-car") deleteCar(id);
    else if (action === "delete-service") deleteService(el.getAttribute("data-car"), id);
    else if (action === "toggle-theme") {
      const now = applyTheme();
      localStorage.setItem(THEME_KEY, now === "light" ? "dark" : "light");
      applyTheme();
      render();
    } else if (action === "open-menu") { menuOpen = true; render(); }
    else if (action === "close-menu") { menuOpen = false; render(); }
    else if (action === "export") exportBackup();
    else if (action === "import") {
      menuOpen = false;
      render();
      document.getElementById("import-file").click();
    } else if (action === "restore") { menuOpen = false; restoreSeed(); }
    else if (action === "dismiss-tip") { localStorage.setItem(TIP_KEY, "1"); render(); }
    else if (action === "confirm-yes") finishConfirm(true);
    else if (action === "confirm-no") finishConfirm(false);
  });

  document.getElementById("app").addEventListener("submit", function (e) {
    const form = e.target.closest("[data-form]");
    if (!form) return;
    e.preventDefault();
    if (form.getAttribute("data-form") === "car") onSubmitCar(form);
    if (form.getAttribute("data-form") === "service") onSubmitService(form);
  });

  document.getElementById("import-file").addEventListener("change", function (e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (file) importBackup(file);
  });

  window.addEventListener("hashchange", function () { menuOpen = false; render(); });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
    if ((localStorage.getItem(THEME_KEY) || "system") === "system") render();
  });

  db = load();
  applyTheme();
  render();
})();

  </script>
</body>
</html>
